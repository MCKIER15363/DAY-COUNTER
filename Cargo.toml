[package]
name = "coords_day"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Shows your XYZ position and the world day on screen."

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { git = "https://github.com/Vasysik/horizon-android", rev = "80700a6f26afe53a368032d8b28bd364f7c3e7e4" }

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
